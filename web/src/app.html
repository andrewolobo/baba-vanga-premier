<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9CGWT2BVXR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9CGWT2BVXR');
    </script>
    <!-- Google Identity Services, for the sign-in button (docs/AUTH_PLAN.md
         D1). Third-party and async: if it is blocked there is no button, and
         nothing else on the page notices. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0e0e11" />
    <!-- Search and share tags (docs/SEO_PLAN.md 1.5). This file is the only
         HTML a link previewer (WhatsApp, X, Facebook) or a non-rendering
         crawler ever sees, so everything every page shares lives here. The
         origin and title are repeated in $lib/site.js, which the pages use;
         site.test.js fails if the two drift. NO canonical here: it would tell
         Google /parlay is a copy of / -- each route sets its own. The share
         image is 1200x630 for the large card (1.7); the structured-data logo
         stays the square app icon. -->
    <title>Football Predictions &amp; Tips — EPL to League Two | BabaVanga</title>
    <meta
      name="description"
      content="Predictions for every Premier League, Championship, League One and League Two match, published before kick-off and graded after."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BabaVanga" />
    <meta property="og:title" content="Football Predictions &amp; Tips — EPL to League Two | BabaVanga" />
    <meta
      property="og:description"
      content="Predictions for every Premier League, Championship, League One and League Two match, published before kick-off and graded after."
    />
    <meta property="og:url" content="https://babavanga.net/" />
    <meta property="og:image" content="https://babavanga.net/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A flaming football over a pixelated orange background, with the babavanga.net wordmark"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://babavanga.net/#organization",
            "name": "BabaVanga",
            "url": "https://babavanga.net/",
            "logo": "https://babavanga.net/web-app-manifest-512x512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://babavanga.net/#website",
            "name": "BabaVanga",
            "url": "https://babavanga.net/",
            "publisher": { "@id": "https://babavanga.net/#organization" }
          }
        ]
      }
    </script>
    <!-- The design is built on Barlow Condensed; every rule that uses it also
         names a narrow system fallback, so a blocked request degrades rather
         than breaks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
