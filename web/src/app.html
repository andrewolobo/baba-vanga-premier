<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9CGWT2BVXR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9CGWT2BVXR');
    </script>
    <!-- Google Identity Services, for the sign-in button (docs/AUTH_PLAN.md
         D1). Third-party and async: if it is blocked there is no button, and
         nothing else on the page notices. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0e0e11" />
    <!-- Share tags that are the same on every page (docs/SEO_PLAN.md 1.5,
         1.7). The ones that name a page -- title, description, canonical,
         og:title, og:description, og:url -- are NOT here: pages are
         server-rendered (2.1), and each renders its own through
         $lib/PageHead.svelte into SvelteKit's head placeholder at the end of
         this element. (Never write that placeholder's name in a comment:
         SvelteKit fills the first occurrence it finds.) A copy here would
         come first in the HTML, so every page would ship the homepage's title
         and an og:url saying it is /. site.test.js pins both halves. The
         share image is 1200x630 for the large card; the structured-data logo
         stays the square app icon. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BabaVanga" />
    <meta property="og:image" content="https://babavanga.net/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A flaming football over a pixelated orange background, with the babavanga.net wordmark"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://babavanga.net/#organization",
            "name": "BabaVanga",
            "url": "https://babavanga.net/",
            "logo": "https://babavanga.net/web-app-manifest-512x512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://babavanga.net/#website",
            "name": "BabaVanga",
            "url": "https://babavanga.net/",
            "publisher": { "@id": "https://babavanga.net/#organization" }
          }
        ]
      }
    </script>
    <!-- The design is built on Barlow Condensed, served from this site
         ($lib/fonts, imported by the layout; no Google Fonts request since
         2026-09-18). Every rule that uses it also names a narrow system
         fallback. -->
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
