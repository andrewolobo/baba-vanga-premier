# Rate-limit zone for the sign-in endpoints (docs/AUTH_PLAN.md D13). Not a
# template -- nothing in it is environment -- so it is copied as-is:
#
#     sudo cp deploy/nginx/bvp-limits.conf /etc/nginx/conf.d/bvp-limits.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# `limit_req_zone` is only valid at http level, which is why it lives in
# conf.d rather than in the site file; the site file's /api/auth/ and
# /api/me/phone locations reference the zone by name. 1 MB tracks ~16,000
# addresses. 10 requests a minute per address, with a burst of 10 in the
# site file, is sized for one household behind a NAT; tune from the access
# log rather than by guessing again.
limit_req_zone $binary_remote_addr zone=bvp_auth:1m rate=10r/m;
