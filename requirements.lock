# Pinned dependency closure for the serving deployment. NOT a requirements file:
# pass it to pip with -c, so `pyproject.toml` stays the source of truth for WHAT
# is needed and this file only fixes WHICH VERSION.
#
#     pip install -e ".[serve,dev]" -c requirements.lock
#
# Why it exists (docs/DEPLOY.md 3.5): pyproject asks for `pandas>=2.0`, so a
# fresh install on the server resolves to whatever is current that day, which is
# not necessarily what the suite passed against. `filterwarnings =
# ["error::FutureWarning"]` makes that a test failure rather than a warning, and
# a pandas release can move the fit as well as the tests.
#
# It pins versions; it CANNOT discover an undeclared dependency, because it is
# computed from what pyproject declares. httpx was missing from `dev` until
# 2026-08-08 and this file inherited the omission -- the Ubuntu install found it,
# not the lock. Add the dependency to pyproject first, then regenerate.
#
# The `scrape` extra is deliberately absent: it pulls patchright, which
# downloads a full Chrome, and the scraper is shelved (OUTSTANDING.md 4.1).
#
# These are the versions the suite passed against on 2026-08-08.
# Markers were evaluated for the target (Ubuntu 24.04, CPython 3.12), not for
# the Windows box that generated it.
#
# Regenerate deliberately, not routinely, and re-run `pytest -q` on the server
# afterwards -- a lock that was bumped without the suite being re-run is worse
# than no lock, because it looks like evidence.

