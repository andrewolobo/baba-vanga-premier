[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baba-vanga-premier"
version = "0.1.0"
description = "Prediction engine for the English professional divisions (E0-E3, EC)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# services/fbref_scraper only. curl_cffi impersonates Chrome's TLS fingerprint
# and patchright drives a real Chrome; nothing else clears fbref's Cloudflare
# challenge (docs/FBREF_SCRAPER.md §1).
scrape = [
    "curl_cffi>=0.15",
    "patchright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
