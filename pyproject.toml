[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baba-vanga-premier"
version = "0.1.0"
description = "Prediction engine for the English professional divisions (E0-E3, EC)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # tests/test_api.py only. `fastapi.testclient` re-exports starlette's, which
    # imports httpx and raises "The starlette.testclient module requires the
    # httpx package" without it -- a COLLECTION error, so the whole suite
    # refuses to run rather than one module failing.
    #
    # This is the same defect the `serve` block below records, repeated: a
    # package present in the development environment and undeclared, so the
    # suite passed here and could not collect on a clean install. It surfaced
    # on the Ubuntu VM on 2026-08-08 at DEPLOY.md 5.4, which is what that gate
    # exists for. It is a TEST dependency -- nothing under api/ imports httpx.
    "httpx>=0.27",
]
# api/ only. Present in the development environment but undeclared until
# 2026-08-04, so a fresh clone could pass the whole test suite and still fail
# to start the API -- the tests use FastAPI's TestClient and never bind a port.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
# services/fbref_scraper only. curl_cffi impersonates Chrome's TLS fingerprint
# and patchright drives a real Chrome; nothing else clears fbref's Cloudflare
# challenge (docs/FBREF_SCRAPER.md §1).
scrape = [
    "curl_cffi>=0.15",
    "patchright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]
